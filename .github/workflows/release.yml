name: release

# Push a tag like v0.2.0 to run this. The tag must equal "v" + memdiag.__version__ and
# CHANGELOG.md must have a "## 0.2.0" section. See docs/RELEASING.md.
#
# Run it manually (Actions tab, or `gh workflow run release`) for a dry run: it runs verify,
# test and build against the current version but never creates a release or publishes.
# In a dry run a failed verify step is a warning, so it still works while CHANGELOG.md
# says "Unreleased".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches version and changelog has notes
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' memdiag/__init__.py)"
          fi
          python scripts/release_check.py "$TAG" --notes release_notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: ignore

  test:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Install the built wheel in a clean venv and run it from outside the repo
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/memdiag" demo --no-color
          "$RUNNER_TEMP/venv/bin/python" -c "import memdiag; print(memdiag.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file release_notes.md $prerelease

  # Off until the repository variable PUBLISH_TO_PYPI is set to "true" and a PyPI trusted
  # publisher is configured for this repo and the "pypi" environment.
  publish-pypi:
    needs: github-release
    if: github.event_name == 'push' && vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
