name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Demo smoke test
        run: memdiag demo --no-color
      - name: Gate passes when thresholds are met and fails when they are not
        run: |
          memdiag demo --no-color --fail-under groundedness=0.5
          ! memdiag demo --no-color --fail-under memory_faithfulness=0.9
