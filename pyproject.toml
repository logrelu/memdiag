[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "memdiag"
version = "0.1.0"
description = "Memory diagnostics for AI agents: separate memory failures from retrieval failures in conversation logs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
memdiag = "memdiag.cli:main"
memdiag-mcp = "memdiag.mcp_server:main"

[tool.setuptools]
packages = ["memdiag"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]  # long lines are mostly HTML/CSS template strings

[tool.pytest.ini_options]
testpaths = ["tests"]
